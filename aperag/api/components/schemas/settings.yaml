Settings:
  type: object
  properties:
    use_mineru:
      type: boolean
      description: Whether to use MinerU
    mineru_api_token:
      type: string
      description: API token for MinerU
    use_doc_ray:
      type: boolean
      description: Whether to use DocRay
    use_markitdown:
      type: boolean
      description: Whether to use MarkItDown
    paddleocr_host:
      type: string
      description: PaddleOCR service URL
    whisper_host:
      type: string
      description: Whisper speech recognition service URL
    chunk_size:
      type: integer
      description: Chunk size for document parsing
    chunk_overlap_size:
      type: integer
      description: Chunk overlap size for document parsing
    kg_chunk_token_size:
      type: integer
      description: Token size for graph chunking
    kg_chunk_overlap_token_size:
      type: integer
      description: Token overlap size for graph chunking
    kg_entity_extract_max_gleaning:
      type: integer
      description: Max gleaning rounds for entity extraction
    kg_llm_model_max_async:
      type: integer
      description: Max concurrent LLM calls for graph processing
    kg_cosine_threshold:
      type: number
      description: Cosine similarity threshold for vector matching
    kg_max_batch_size:
      type: integer
      description: Max batch size for graph processing
    kg_summary_max_tokens:
      type: integer
      description: Max tokens for entity/relation summaries
    kg_force_llm_summary_on_merge:
      type: integer
      description: Threshold to force LLM summary when merging entities
    kg_entity_types:
      type: array
      items:
        type: string
      description: Custom entity types for knowledge graph extraction
    cache_enabled:
      type: boolean
      description: Whether LLM cache is enabled
    cache_ttl:
      type: integer
      description: Cache TTL in seconds
    parent_child_enabled:
      type: boolean
      description: Enable parent-child chunking for richer retrieval context
    parent_chunk_size:
      type: integer
      description: Parent chunk size in tokens
    child_chunk_size:
      type: integer
      description: Child chunk size in tokens
    child_chunk_overlap:
      type: integer
      description: Overlap size between child chunks in tokens
    parent_chunk_separator:
      type: string
      description: Separator for parent chunks e.g. "##". Empty = hierarchy-based
    child_chunk_separator:
      type: string
      description: Separator for child chunks e.g. "\n\n". Empty = semantic splitting
    preprocess_collapse_whitespace:
      type: boolean
      description: Collapse consecutive spaces, newlines and tabs
    preprocess_remove_urls_emails:
      type: boolean
      description: Remove all URLs and email addresses before chunking
